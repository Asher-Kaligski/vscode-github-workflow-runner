<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- Connected workflow nodes: three larger round steps with inline glyphs -->

  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Triangular outline connecting nodes -->
    <path d="M8.5 8.5 L15 10 L11 15.5 Z" fill="none" />

    <!-- Node circles (larger and more prominent) -->
    <circle cx="6" cy="6" r="4.8" />
    <circle cx="18" cy="9" r="4.8" />
    <circle cx="10.5" cy="18" r="4.8" />

    <!-- Inline glyphs inside nodes -->
    <!-- Left node: play triangle -->
    <path d="M5.2 4.7 L7 6 L5.2 7.3 Z" fill="currentColor" stroke="none" />
    <!-- Right node: centered plus -->
    <path d="M18 8.2 L18 9.8" stroke-width="1.3" />
    <path d="M17.2 9 L18.8 9" stroke-width="1.3" />
    <!-- Bottom node: checkmark -->
    <path d="M9.8 18.1 L10.3 18.5 L11.1 17.8" stroke-width="1.3" />
  </g>
</svg>
