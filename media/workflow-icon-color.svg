<svg width="128" height="128" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- Colored marketplace icon: connected workflow nodes on GitHub-style blue badge -->

  <!-- GitHub-style blue badge: white ring, main blue, dark blue wedge -->
  <circle cx="12" cy="12" r="11.5" fill="#FFFFFF" />
  <circle cx="12" cy="12" r="10.5" fill="#2088FF" />
  <path d="M12 1.5 A10.5 10.5 0 0 1 22.5 12 L12 12 Z" fill="#0052CC" />

  <!-- Connected workflow nodes glyph in high-contrast white -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Triangular outline connecting nodes -->
    <path d="M8.5 8.5 L15 10 L11 15.5 Z" fill="none" stroke-width="2.4" />

    <!-- Node circles (larger and more prominent) -->
    <circle cx="6" cy="6" r="4.8" fill="none" stroke-width="2.7" />
    <circle cx="18" cy="9" r="4.8" fill="none" stroke-width="2.7" />
    <circle cx="10.5" cy="18" r="4.8" fill="none" stroke-width="2.7" />

    <!-- Inline glyphs inside nodes -->
    <!-- Left node: play triangle -->
    <path d="M5.2 4.7 L7 6 L5.2 7.3 Z" fill="#FFFFFF" stroke="none" />
    <!-- Right node: centered plus -->
    <path d="M18 8.2 L18 9.8" stroke-width="1.3" />
    <path d="M17.2 9 L18.8 9" stroke-width="1.3" />
    <!-- Bottom node: checkmark -->
    <path d="M9.8 18.1 L10.3 18.5 L11.1 17.8" fill="none" stroke-width="1.3" />
  </g>
</svg>
