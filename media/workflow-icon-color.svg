<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background (GitHub Dark Dimmed) -->
  <rect width="128" height="128" rx="28" fill="url(#bg-gradient)"/>

  <!-- Group everything and scale down to fit with padding -->
  <g transform="translate(14, 14) scale(0.78)">
    
    <!-- Connecting Lines -->
    <path d="M32 56 C 32 64, 40 64, 56 64" stroke="#58a6ff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M32 56 V 84 C 32 104, 40 104, 56 104" stroke="#58a6ff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M88 64 H 102" stroke="#58a6ff" stroke-width="6" stroke-linecap="round" />
    <path d="M88 104 H 102" stroke="#58a6ff" stroke-width="6" stroke-linecap="round" />

    <!-- Root Node: Play (Large, Top Left) -->
    <circle cx="32" cy="32" r="22" stroke="#58a6ff" stroke-width="6" fill="#0d1117" filter="url(#glow)"/>
    <path d="M26 22 L 44 32 L 26 42 Z" fill="#58a6ff"/>

    <!-- Top Row Nodes (Pass) -->
    <circle cx="72" cy="64" r="16" stroke="#238636" stroke-width="5" fill="#0d1117"/>
    <path d="M65 64 L 69 68 L 79 58" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <circle cx="118" cy="64" r="16" stroke="#238636" stroke-width="5" fill="#0d1117"/>
    <path d="M111 64 L 115 68 L 125 58" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Row Nodes -->
    <!-- Node B1 (Skip - Grey) -->
    <circle cx="72" cy="104" r="16" stroke="#6e7681" stroke-width="5" fill="#0d1117"/>
    <circle cx="72" cy="104" r="9" stroke="#8b949e" stroke-width="3"/>
    <path d="M66 110 L 78 98" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>

    <!-- Node B2 (Pass - Green) -->
    <circle cx="118" cy="104" r="16" stroke="#238636" stroke-width="5" fill="#0d1117"/>
    <path d="M111 104 L 115 108 L 125 98" stroke="#3fb950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>