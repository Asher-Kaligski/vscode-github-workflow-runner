name: Build and Test

on:
  pull_request:
    branches: ['main']

jobs:
  build:
    strategy:
      matrix:
        task: [lint, package, test, check-format]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
